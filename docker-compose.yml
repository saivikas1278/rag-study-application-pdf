version: '3.8'

services:
  study-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma_db
    volumes:
      - chroma_data:/app/data/chroma_db
    restart: unless-stopped

volumes:
  chroma_data:
    driver: local
